services:
  app-begher:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: app-begher
    working_dir: /var/www/html
    command: php artisan serve --host=0.0.0.0 --port=7000
    ports:
      - "7000:7000"
    volumes:
      - .:/var/www/html
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: mysql:8.0
    container_name: bagher-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: laravel
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql

volumes:
  dbdata:
